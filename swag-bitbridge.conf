# SWAG Reverse Proxy Configuration for bitbridge.respond2.me
#
# Place this file in:
#   /mnt/user/appdata/swag/nginx/proxy-confs/bitbridge.subdomain.conf
# Then run: docker restart swag

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name bitbridge.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # BitBridge container name and internal port
        set $upstream_app esp-control-plane;
        set $upstream_port 8787;
        set $upstream_proto http;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client IP through
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
