<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BitBridge &mdash; Sign In</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      background: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: #212529;
      margin-bottom: 0.25rem;
    }

    .brand-sub {
      font-size: 0.875rem;
      color: #6c757d;
      margin-bottom: 1.75rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">BitBridge</div>
    <div class="brand-sub">ESP32 Control Plane</div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="usernameInput" class="form-label fw-semibold">Username</label>
        <input
          id="usernameInput"
          type="text"
          class="form-control"
          placeholder="admin"
          autocomplete="username"
          autofocus
        />
      </div>
      <div class="mb-3">
        <label for="passwordInput" class="form-label fw-semibold">Password</label>
        <input
          id="passwordInput"
          type="password"
          class="form-control"
          placeholder="Enter password"
          autocomplete="current-password"
        />
      </div>
      <div id="loginError" class="text-danger small mb-2" style="display:none;"></div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
  </div>

  <script>
    (function () {
      const form = document.getElementById("loginForm");
      const usernameInput = document.getElementById("usernameInput");
      const passwordInput = document.getElementById("passwordInput");
      const errorEl = document.getElementById("loginError");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorEl.style.display = "none";

        const username = (usernameInput.value || "").trim();
        const password = passwordInput.value || "";
        if (!username || !password) {
          errorEl.textContent = "Enter username and password.";
          errorEl.style.display = "";
          return;
        }

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            credentials: "same-origin"
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.ok) {
            const redirect = new URLSearchParams(window.location.search).get("next") || "/admin";
            window.location.replace(redirect);
          } else {
            errorEl.textContent = data.error || "Invalid username or password.";
            errorEl.style.display = "";
            passwordInput.value = "";
            passwordInput.focus();
          }
        } catch {
          errorEl.textContent = "Network error — try again.";
          errorEl.style.display = "";
        }
      });
    })();
  </script>
</body>
</html>
