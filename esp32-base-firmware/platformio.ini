[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Board-specific build flags
build_flags =
  -DCORE_DEBUG_LEVEL=2

; Partition scheme for larger apps with OTA support
board_build.partitions = partitions.csv

; Libraries
lib_deps =
  WiFiManager@>0.15
  ArduinoJson@>=6.18.0

; Monitor options
monitor_filters = esp32_exception_decoder

; Build optimization
build_type = release
